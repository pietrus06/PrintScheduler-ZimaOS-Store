name: qr-studio
services:
  qr-studio:
    image: ghcr.io/pietrus06/printscheduler-zimaos-store:qr-studio-1.1.2
    pull_policy: always
    container_name: qr-studio
    restart: unless-stopped
    ports:
      - target: 8787
        published: "8099"
        protocol: tcp
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      TZ: Europe/Monaco
    volumes:
      - type: bind
        source: /DATA/AppData/QRStudio
        target: /app/data
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8787/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
x-casaos:
  id: fr.pietrus06.qr-studio
  main: qr-studio
  index: /
  port_map: "8099"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/pietrus06/PrintScheduler-ZimaOS-Store@main/Apps/QRStudio/icon.svg
  title:
    en_US: QR Studio
    fr_FR: QR Studio
  tagline:
    en_US: Generate numbered QR codes and printable PDF sheets.
    fr_FR: Générez des QR codes numérotés et des planches PDF imprimables.
  description:
    en_US: Local QR code generator with fixed text, inclusive number ranges, zero padding, one code per page or compact A4 sheets, PDF export and printing.
    fr_FR: Générateur local de QR codes avec texte fixe, plage de numéros inclusive, zéros automatiques, un code par page ou planches A4 compactes, export PDF et impression.
  author: pietrus06
  developer: Pierre
  category: Utilities
  architectures:
    - amd64
    - arm64
  version: "1.1.2"
  update_at: "2026-09-17"
  release_notes:
    en_US: Uses an immutable image tag to guarantee deployment of the current interface.
    fr_FR: Utilise une image versionnée pour garantir le déploiement de la nouvelle interface.
  repo: https://github.com/pietrus06/PrintScheduler-ZimaOS-Store
  support: https://github.com/pietrus06/PrintScheduler-ZimaOS-Store/issues
