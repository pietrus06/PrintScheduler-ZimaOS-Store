name: Build and publish QR Studio

on:
  push:
    branches:
      - main
    paths:
      - "Apps/QRStudio/**"
      - ".github/workflows/publish-qr-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: Apps/QRStudio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pietrus06/printscheduler-zimaos-store:qr-studio-latest
            ghcr.io/pietrus06/printscheduler-zimaos-store:qr-studio-1.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
