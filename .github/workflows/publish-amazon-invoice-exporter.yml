name: Build and publish Amazon Invoice Exporter

on:
  push:
    branches:
      - main
    paths:
      - "Apps/AmazonInvoiceExporter/source-v1.0.0.zip"
      - "Apps/AmazonInvoiceExporter/Dockerfile"
      - ".github/workflows/publish-amazon-invoice-exporter.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: Apps/AmazonInvoiceExporter
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pietrus06/printscheduler-zimaos-store:amazon-invoice-exporter-latest
            ghcr.io/pietrus06/printscheduler-zimaos-store:amazon-invoice-exporter-1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
