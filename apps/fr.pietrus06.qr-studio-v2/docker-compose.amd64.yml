name: qr-studio-v2
services:
  qr-studio-v2:
    image: ghcr.io/pietrus06/printscheduler-zimaos-store:qr-studio-v2-2.3.0@sha256:d45a11bcef9b7d609a90a0c81df95864df3f9bad7c8ee020c4684c28eca68526
    pull_policy: always
    container_name: qr-studio-v2
    restart: unless-stopped
    ports:
      - target: 8787
        published: "8100"
        protocol: tcp
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      TZ: Europe/Monaco
    volumes:
      - type: bind
        source: /DATA/AppData/QRStudioV2
        target: /app/data
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8787/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
x-casaos:
  id: fr.pietrus06.qr-studio-v2
  main: qr-studio-v2
  index: /
  port_map: "8100"
  scheme: http
  icon: https://raw.githubusercontent.com/pietrus06/PrintScheduler-ZimaOS-Store/gh-pages/apps/fr.pietrus06.qr-studio-v2/assets/icon.svg
  title:
    en_US: QR Studio V2
    fr_FR: QR Studio V2
  version: "2.3.0"
