name: supabase-manager

services:
  supabase-manager:
    image: ghcr.io/pietrus06/printscheduler:supabase-manager-latest@sha256:d68adc060eca86c6480acff56e89f2e2c0cdd5acd876b1bbab16fb875aaf064d
    container_name: supabase-manager
    restart: unless-stopped
    ports:
      - target: 8096
        published: "8096"
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA/AppData/SupabaseManager
        target: /DATA/AppData/SupabaseManager
      - type: bind
        source: /DATA/AppData/SupabaseProjects
        target: /DATA/AppData/SupabaseProjects
    environment:
      PORT: "8096"
      DATA_ROOT: /DATA/AppData/SupabaseManager
      PROJECTS_ROOT: /DATA/AppData/SupabaseProjects
      SUPABASE_UPSTREAM_REPO: https://github.com/supabase/supabase.git
      TZ: Europe/Monaco
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8096/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

x-casaos:
  id: fr.pietrus06.supabase-manager
  main: supabase-manager
  index: /
  port_map: "8096"
  scheme: http
  icon: https://raw.githubusercontent.com/pietrus06/PrintScheduler-ZimaOS-Store/gh-pages/apps/fr.pietrus06.supabase-manager/assets/icon.svg
  title:
    en_US: Supabase Manager
    fr_FR: Supabase Manager
  version: "0.1.0"
